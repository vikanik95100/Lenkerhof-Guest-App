<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lenkerhof Guest App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@300;400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#2A2414;--bg:#F8F3E5;--sand:#AFA07B;--gold:#817146;--lsand:#C4B898;--paper:#FFFDF6;--warm:#D9824B;--ice:#7BB8CF;--mut:rgba(42,36,20,.6);--line:rgba(129,113,70,.25);--c:"Open Sans",system-ui,sans-serif;--f:"Encode Sans Condensed","Arial Narrow",sans-serif;--s:1}
html,body{height:100%}
body{font-family:var(--c);background:#E8E0CB;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--ink);color:#fff}
.top img{height:36px;display:block}
.top small{font-size:13.5px;color:rgba(255,255,255,.6)}
.sp{flex:1}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px;font-weight:600}
.tag.hot{background:var(--sand);color:var(--ink);border-color:var(--sand);font-weight:700}
.tag[aria-pressed=true]{background:#fff;color:var(--ink)}
.layout{display:grid;grid-template-columns:236px 1fr 340px;height:calc(100% - 62px)}
body[data-notes=off] .layout{grid-template-columns:236px 1fr 0}body[data-notes=off] .notes{display:none}
.rail{padding:22px 16px;overflow:auto;border-right:1px solid rgba(129,113,70,.22);background:#F2EBD6}
.rg{margin-bottom:20px}.rg .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:0 10px 8px;font-weight:700}
.ri{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-size:15.5px;font-weight:500;color:#4a4430}
.ri .n{font-size:12px;color:#a39a88;width:18px;font-variant-numeric:tabular-nums}
.ri:hover{background:rgba(42,36,20,.05)}
.ri[aria-current=true]{background:var(--ink);color:#fff}.ri[aria-current=true] .n{color:rgba(255,255,255,.55)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(900px 620px at 50% 38%,#FFFBEC,#E5DCC3)}
.pw{width:calc(390px*var(--s));height:calc(844px*var(--s));position:relative;flex:none}
.phone{width:390px;height:844px;border-radius:56px;position:absolute;top:0;left:0;transform-origin:0 0;transform:scale(var(--s));background:#000;box-shadow:0 0 0 10px #231e10,0 0 0 11.5px var(--sand),0 60px 90px -25px rgba(42,36,20,.55)}
.screen{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate}
.hint{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;color:#6f6858}
.hint button{border:1.5px solid var(--ink);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600;background:#fff}.hint button:disabled{opacity:.3}
.notes{padding:26px 26px 20px;overflow:auto;border-left:1px solid rgba(129,113,70,.22);background:#F2EBD6}
.notes .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.notes h2{font-family:var(--f);font-weight:300;font-size:38px;margin:6px 0 8px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.notes p.l{font-size:15px;line-height:1.55;color:#5a5440}
.notes ul{margin:14px 0 0 18px;font-size:14.5px;line-height:1.55;color:#2c2616}.notes li{margin-bottom:8px}
.why{margin-top:18px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--sand);box-shadow:3px 3px 0 var(--lsand)}
.why p{font-size:14.5px;line-height:1.5;margin-top:4px}
.foot{font-size:12.5px;line-height:1.55;color:#8d8576;margin-top:20px}
.sbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:8px 36px 0 40px;font-weight:600;font-size:16px;pointer-events:none;color:var(--ink);transition:color .3s}
.screen[data-th=dark] .sbar{color:#fff}
.sbar i{display:inline-block;width:17px;height:11px;border-radius:3px;border:1.5px solid currentColor;margin-left:6px;position:relative;opacity:.9}
.sbar i:after{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1px;width:60%}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:22px;background:#000;z-index:70;transition:width .55s cubic-bezier(.2,.9,.25,1.05),height .55s cubic-bezier(.2,.9,.25,1.05);overflow:hidden;cursor:pointer;color:#fff}
.island .in{opacity:0;transition:opacity .25s;display:flex;align-items:center;gap:12px;padding:13px 18px;white-space:nowrap}
.island.open{width:358px;height:80px;border-radius:40px}.island.open .in{opacity:1;transition-delay:.2s}
.island .ico{width:42px;height:42px;border-radius:50%;background:var(--sand);color:var(--ink);display:grid;place-items:center;flex:none}
.island b{font-size:16px;font-weight:700;display:block}.island span.s{font-size:13px;color:rgba(255,255,255,.62)}
.island .t{margin-left:auto;font-family:var(--f);font-weight:300;font-size:32px;color:var(--lsand)}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .4s,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;background:var(--bg)}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.view.dk{background:var(--ink);color:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px 0 132px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.rv{opacity:0}.on .rv{animation:up .75s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--d,0)*65ms + 100ms)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.hd{font-family:var(--f);font-weight:300;text-transform:uppercase;letter-spacing:.01em;line-height:.92}
.hd b{font-weight:800}
.h2{font-family:var(--f);font-weight:300;font-size:30px;text-transform:uppercase;line-height:1}
.h2 b{font-weight:800}
.h3{font-weight:700;font-size:16px;line-height:1.2}
.m{font-size:13.5px;color:var(--mut);line-height:1.45}
.p{font-size:15.5px;line-height:1.55}
.stk{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--sand);color:var(--ink);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.stk.d{background:var(--ink);color:#fff}.stk.w{background:rgba(255,255,255,.92);color:var(--ink)}.stk.o{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--sand)}.stk.gl{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px)}.stk.warm{background:var(--warm);color:#fff}.stk.ice{background:var(--ice);color:#06222c}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;position:relative;overflow:hidden;box-shadow:0 14px 30px -22px rgba(42,36,20,.5)}
.ph{background-size:cover;background-position:center;background-color:#cdc3a8;position:relative}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,25,12,.42) 0%,rgba(30,25,12,0) 34%,rgba(30,25,12,.12) 55%,rgba(30,25,12,.88) 100%)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:56px;border-radius:99px;font-family:var(--f);font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase;transition:transform .15s;background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn.sand{background:var(--sand);color:var(--ink)}.btn.w{background:#fff;color:var(--ink)}.btn.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--sand)}.btn.sm{height:46px;font-size:14px}.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);backdrop-filter:blur(8px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--sand);white-space:nowrap;background:transparent;transition:all .2s}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.chip:disabled{opacity:.3}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 20px;scroll-snap-type:x proximity}.row::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:14px;right:14px;bottom:18px;height:72px;border-radius:36px;z-index:50;display:flex;align-items:center;justify-content:space-around;padding:0 10px;background:rgba(42,36,20,.8);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 18px 36px -10px rgba(30,25,12,.6),inset 0 0 0 1px rgba(196,184,152,.3);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.screen[data-tb=off] .tabbar{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:8px 8px;min-width:56px;transition:color .2s}
.tab[aria-current=true]{color:var(--lsand)}
.tab.kf{width:64px;height:64px;min-width:64px;border-radius:50%;background:linear-gradient(135deg,#d3c7a4,#afa07b 60%,#8a7b55);color:var(--ink);margin-top:-30px;border:4px solid var(--bg);justify-content:center;box-shadow:0 10px 24px -6px rgba(129,113,70,.8);padding:0}
.bar{display:flex;align-items:center;gap:12px;padding:0 20px 14px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:var(--ink);box-shadow:0 4px 14px -4px rgba(42,36,20,.4)}
.back.glass{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.dk .back{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:24px;padding:16px;position:relative;overflow:hidden;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid var(--line);background:var(--paper)}
.big{font-family:var(--f);font-weight:300;font-size:54px;letter-spacing:-.01em;line-height:.95}.big small{font-size:.38em;letter-spacing:0;margin-left:3px;color:var(--mut);font-weight:400}
.pulse{width:9px;height:9px;border-radius:50%;background:#3DBE86;position:relative;display:inline-block;flex:none}
.pulse:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid #3DBE86;animation:pl 1.8s infinite}
@keyframes pl{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.mq{overflow:hidden;white-space:nowrap;font-family:var(--f);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:13px}
.mq div{display:inline-block;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;border-radius:30px 30px 0 0;padding:10px 20px 32px;transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.85,.25,1);background:var(--paper);box-shadow:0 -24px 50px rgba(30,25,12,.45);color:var(--ink);max-height:92%;overflow-y:auto;scrollbar-width:none}
.sheet.on{transform:none}.sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--sand);margin:0 auto 16px}
.scrim{position:absolute;inset:0;z-index:54;background:rgba(30,25,12,.5);opacity:0;pointer-events:none;transition:opacity .4s}.scrim.on{opacity:1;pointer-events:auto}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sand);font-size:22px;font-weight:500;display:grid;place-items:center}
.stepper b{font-family:var(--f);font-size:32px;font-weight:300;min-width:26px;text-align:center}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;gap:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:700}
.msg{max-width:84%;padding:11px 16px;border-radius:20px;font-size:15.5px;line-height:1.45;animation:up .5s both}
.msg.in{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 4px 14px -8px rgba(42,36,20,.5)}
.msg.out{background:var(--ink);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg small{display:block;font-size:11.5px;opacity:.5;margin-top:5px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.msg .acts button{font-size:13.5px;font-weight:700;padding:7px 14px;border-radius:99px;background:var(--sand)}
.typing{display:flex;gap:4px;padding:15px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.4;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:.9}}
.toast{position:absolute;left:50%;bottom:116px;transform:translate(-50%,20px);z-index:80;padding:12px 20px;border-radius:99px;font-size:14.5px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;background:var(--ink);color:#fff;box-shadow:0 0 0 1.5px var(--sand)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kenb{position:absolute;inset:-6%;background-size:cover;background-position:50% 50%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16) translate(-2%,-1%)}}
.keybtn{position:relative;width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#d6cba8,#afa07b 55%,#8a7b55);color:var(--ink);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s,background .3s;flex:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.3)}
.keybtn:active{transform:scale(.95)}.keybtn.ok{background:#2f9e6c;color:#fff}
.keybtn svg.rg{position:absolute;inset:-12px;width:136px;height:136px;transform:rotate(-90deg)}
.keybtn .rp{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0}.keybtn.ok .rp{animation:rip 1.2s infinite}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.chk{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--sand);display:grid;place-items:center;flex:none;transition:all .25s;color:transparent;background:#fff}
.chk.on{background:var(--ink);color:var(--lsand);box-shadow:none}
.seg{display:flex;background:#EFE8D3;border-radius:99px;padding:4px;gap:2px}.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:99px;font-weight:700;font-size:13.5px;transition:all .2s;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.toggle{width:52px;height:30px;border-radius:99px;background:rgba(42,36,20,.2);position:relative;transition:background .25s;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle[aria-pressed=true]{background:#2f9e6c}.toggle[aria-pressed=true]:after{transform:translateX(22px)}
.pass{background:linear-gradient(160deg,#3a331d,var(--ink) 60%,#1c170a);color:#fff;border-radius:30px;position:relative;box-shadow:0 22px 40px -18px rgba(42,36,20,.85)}
.pass:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--sand),#e6dcbe,var(--sand));border-radius:30px 30px 0 0}
.perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.25);margin:0 22px}
.perf:before,.perf:after{content:"";position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.perf:before{left:-36px}.perf:after{right:-36px}
.fld .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;font-weight:700}.fld .v{font-family:var(--f);font-weight:500;font-size:19px;margin-top:2px}
.gl{backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.heat{display:flex;gap:5px}.heat i{width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,.2);transition:background .5s}.heat i.on{background:linear-gradient(90deg,#f0b46a,var(--warm))}
.heat.ice i.on{background:linear-gradient(90deg,#bfe6f2,var(--ice))}
.vapor{position:absolute;left:0;right:0;bottom:0;height:60%;background:radial-gradient(60% 80% at 30% 100%,rgba(255,255,255,.25),transparent),radial-gradient(50% 70% at 75% 100%,rgba(255,255,255,.2),transparent);animation:vp 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes vp{from{transform:translateY(8%) scale(1);opacity:.6}to{transform:translateY(-6%) scale(1.15);opacity:1}}
.breath{position:relative;width:250px;height:250px;margin:0 auto;display:grid;place-items:center}
.breath .o,.breath .m2,.breath .c{position:absolute;border-radius:50%}
.breath .o{inset:0;border:1.5px solid rgba(255,255,255,.35)}
.breath .m2{inset:30px;border:1px solid rgba(255,255,255,.2)}
.breath .c{width:120px;height:120px;background:radial-gradient(circle at 35% 30%,#f1e8cc,var(--sand) 65%,#7e7050);box-shadow:0 0 60px rgba(196,184,152,.55);transition:transform 4s cubic-bezier(.45,0,.55,1)}
.breath.in .c{transform:scale(1.75)}.breath.hold .c{transform:scale(1.75);transition-duration:.2s}.breath.out .c{transform:scale(1);transition-duration:8s}
@media(max-width:1080px){.layout{grid-template-columns:200px 1fr 0}.notes{display:none}}

var NOTES={
welcome:["Arrival","Welcome","The resort's own promise: a gourmet spa resort with mountains in every window, 5-star superior, with the Relais & Châteaux spirit.",["A slow drift over the real winter aerial of the hotel and its spa landscape.","A ticker with the facts guests choose Lenkerhof for: the Wildstrubel, 2,000 m² of spa, nine saunas.","The guest opens the stay from the booking e-mail, or the button below.","The app is shown in English; German, English and French mirror the website."],"Guests book Lenkerhof for the feeling of the place. The app should open with the view, not with a login."],
home:["Arrival","Today & key card","Arrival day on a 3-for-2 winter stay, shown as a dark key card with a hold-to-unlock button (try it).",["Real: the 'Lenkerhof-Mehrwert' every guest gets: welcome drink, breakfast buffet, the 7sources spa, non-alcoholic minibar, Wi-Fi, live music at the bar (not on Mondays) and all buses and trains in the Simmental and Saanenland.","The 3-for-2 offer is real (Sunday to Friday); the Gourmet-Package is CHF 96 per person per day.","The pill at the top is a Live Activity for tonight's dinner (tap it)."],"Check-in is the busiest hour of the day. The app lets guests start the stay in the spa while the room is prepared."],
room:["Arrival","Room & upgrades","The Premium Double Room (35 sqm): a south balcony facing the Wildstrubel, box-spring beds of 180 by 210 cm and a rain shower.",["Real sizes and features for eight room and suite categories, from the 28 sqm Cosy Double to the 94 sqm Luxury Panorama Spa Suite with a private whirlpool and rotating fireplace.","Swipe the upgrade cards; a request goes to reservations. Rates are not published, so none are shown.","The pillow menu, coffee menu and 24-hour room service exist at the hotel; the buttons here are the concept."],"Upgrades are the easiest revenue on a stay, and the best moment to offer them is while the guest is already enjoying the room."],
spa:["7sources beauty & spa","The spa today","A 2,000 sqm spa landscape: indoor pool, outdoor pool, nine saunas, gym and relaxation rooms.",["Real hours: textile sauna 9:00 to 20:00; textile-free area 11:00 to 20:00 from December to March (14:00 to 20:00 April to November); baths 9:00 to 20:00 (hotel guests from 7:30); gym 9:00 to 20:00 (guests from 7:30).","Outdoor pool 34°C, indoor pool 28°C; the 7sources package gives guests a bathrobe, slippers, a spa bag, teas, juices, bouillon and fruit.","The 'how busy is it' meter is a concept and uses illustrative numbers."],"The spa is the main reason guests choose a stay. Showing what is open and quiet right now makes every hour of a long weekend better."],
sauna:["7sources beauty & spa","Sauna world","The nine sauna experiences as an explorer: textile and textile-free, from the scented steam bath to the ice grotto.",["Real: scented steam bath, Finnish sauna and bio sauna in the textile area; salt grotto, Finnish infusion sauna with a view of Lenk, pine-cone bio sauna, ice grotto, stone-oil sauna and a cooling pool in the textile-free area.","Infusions are offered daily subject to availability in the 'Heisses Stéefeli' and the 'Saalz Stolè'.","Heat levels are illustrative; the hotel can set the real values."],"Nine saunas is a lot. A guide to which one suits the mood turns a long list into a spa routine."],
calm:["7sources beauty & spa","Calm","A breathing guide for a minute between saunas: a ring that expands as you inhale and softens as you exhale.",["This is a concept feature, not something the hotel offers today.","Three rhythms: relax, balance and deep. Tap start to begin.","It uses the hotel's own mountain photography, and could carry a spa playlist or a guided audio from the team."],"Calm is the product. A small ritual in the app extends the feeling of the spa to the room, the balcony and the journey home."],
treat:["7sources beauty & spa","Treatments","New since summer 2026: skincare treatments with Niance and Alpeor, and the Pneumatron 200N therapy.",["Real: Niance (longevity skincare, made in Switzerland), Alpeor (vegan alpine plant care, made in Switzerland) and the Pneumatron 200N (massage, cupping and lymph-drainage elements).","Direct bookers get 20% off wellness and beauty treatments from Sunday to Thursday (not around Christmas and New Year).","Day-spa packages for friends are the real ones: CHF 104, 134, 160 and 240. Prices of single treatments are in the spa brochure, so none are shown."],"The spa menu is a PDF. A booking sheet with the direct-booking discount applied turns browsing into bookings."],
dine:["Taste","Dining","Three restaurants, the bar, the cigar lounge and the Gourmet-Package in one place.",["Real: Spettacolo (Gault&Millau 16, Falstaff 92 and 3 of 4 forks); Oh de Vie (Italian and French, Gault&Millau 15, closed Monday and Tuesday evenings); the mountain restaurant Bühlberg at 1,664 m with a transfer at fixed times.","The Gourmet-Package costs CHF 96 per person per day for the whole stay.","Dress code: sporty-elegant; men wear long trousers in the evening. Breakfast is 7:30 to 11:00; the bar is open 10:30 to 00:30 with live music (not on Mondays)."],"Guests who book the Gourmet-Package still need a table every night. The app does that in two taps and frees the phone."],
wine:["Taste","Wine cellar","Nearly 500 wines, more than 160 from Switzerland, plus the tasting that comes with a direct booking.",["Real: the tasting is held Monday to Thursday at 17:30, with three wines (3 dl); direct bookers get a voucher per adult at check-in.","The cellar is also an on-site shop (Vinothek): wines can be bought or shipped home.","Your voucher card shows the tasting; tap to add it to the stay."],"Wine is the easiest upgrade a gourmet resort has. A voucher in the app makes sure it is used and remembered."],
mountain:["Lenk & more","Mountains & Lenk","The Lenk valley by season: 200 km of slopes in winter, the Bühlberg and Betelberg in summer, and ideas for families.",["Real: over 200 km of slopes on two sides of the valley; the Bühlberg restaurant at 1,664 m; the Betelberg family mountain with the Luchstrail and Murmelitrail; the BoulderSchüür with a 270 sqm climbing wall; mountain carts and a pump track.","Free local buses and trains between the Simmental and the Saanenland, and a free shuttle from Lenk station on request.","Saved ideas drop into the stay."],"Guests stay longer when they have things to do. The hotel's own list is the best one, and the app puts it in a pocket."],
chat:["Lenk & more","Concierge chat","An answer bot built on the hotel's own guest information, with the team behind it.",["Try 'breakfast', 'dog', 'spa hours', 'parking', 'kids', 'dress code', 'shuttle', 'wine' or 'room service'.","Answers use the real hours and prices, such as CHF 36 per night for a dog.","Anything else goes to reception at +41 33 736 36 36."],"The same questions arrive every day. The app answers them in a second and leaves the team to look after guests."],
checkout:["Lenk & more","Check-out","The folio, the 3-for-2 saving and a thank-you.",["Real: the CHF 96 Gourmet-Package for 2 people over 3 days, the 3-for-2 offer and the 20% treatment discount.","The room rate is a placeholder; the hotel does not publish rates.","The next stay is one tap away: book early and save 15%, or 3-for-2 again."],"A clear folio closes the stay well. A next-stay offer starts the next booking before the guest has left."]};
